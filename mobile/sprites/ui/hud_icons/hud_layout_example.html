<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Juan Buddy - Redesigned Pixel Header HUD Reference</title>
<style>
  * { box-sizing: border-box; image-rendering: pixelated; }
  body { margin: 0; background: #d6f0c8; font-family: 'Courier New', monospace; }

  .jb-header {
    width: 100%;
    height: 76px;
    background: url('sprites_4x/header_bar_tile.png') repeat-x left top;
    background-size: auto 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }

  .jb-pet-hud {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .jb-portrait-wrap {
    position: relative;
    width: 64px;
    height: 64px;
    background: url('sprites_4x/portrait_frame_full.png') no-repeat center/contain;
  }

  .jb-portrait-face {
    position: absolute;
    inset: 10px;
    width: 44px;
    height: 44px;
    object-fit: contain;
  }

  .jb-portrait-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .jb-level-badge {
    position: absolute;
    right: -8px;
    bottom: -4px;
    width: 46px;
    height: 22px;
    background: url('sprites_4x/level_badge.png') no-repeat center/100% 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: #241926;
  }

  .jb-pet-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .jb-nameplate {
    min-width: 190px;
    height: 28px;
    padding: 0 14px;
    background: url('sprites_4x/nameplate_bg.png') no-repeat center/100% 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .jb-exp-row {
    position: relative;
    display: flex;
    align-items: center;
  }

  .jb-exp-star {
    width: 24px;
    height: 24px;
    margin-right: -10px;
    z-index: 2;
  }

  .jb-exp-bar {
    position: relative;
    width: 220px;
    height: 22px;
    background: url('sprites_4x/exp_bar_frame.png') no-repeat center/100% 100%;
    padding: 4px 5px;
  }

  .jb-exp-fill {
    height: 100%;
    width: 75%; /* Dynamic EXP % in JS! */
    background: url('sprites_4x/exp_bar_fill_green.png') repeat-x left center/auto 100%;
  }

  .jb-exp-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    color: #fff;
    text-shadow: 1px 1px 0 #241926;
  }

  .jb-right-widgets {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .jb-pill {
    height: 44px;
    min-width: 130px;
    padding: 0 14px;
    background: url('sprites_4x/widget_pill_bg.png') no-repeat center/100% 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-weight: 900;
    font-size: 13px;
  }

  .jb-pill img { width: 24px; height: 24px; }
</style>
</head>
<body>
  <header class="jb-header">
    <div class="jb-pet-hud">
      <div class="jb-portrait-wrap">
        <!-- Put your active pet sprite here -->
        <img class="jb-portrait-face" src="" alt="Pet" />
        <img class="jb-portrait-overlay" src="sprites_4x/portrait_frame_overlay.png" alt="" />
        <div class="jb-level-badge">LV.7</div>
      </div>
      <div class="jb-pet-meta">
        <div class="jb-nameplate">
          <span>BUDDY</span>
          <span style="color:#b0ffc0;font-size:11px;">HAPPY</span>
        </div>
        <div class="jb-exp-row">
          <img class="jb-exp-star" src="icons_4x/icon_exp_star.png" alt="EXP" />
          <div class="jb-exp-bar">
            <div class="jb-exp-fill" style="width:75%;"></div>
            <div class="jb-exp-label">EXP 75%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="jb-right-widgets">
      <div class="jb-pill">
        <img src="icons_4x/icon_coin.png" alt="Coins" />
        <span style="color:#fff0a8;">512</span>
      </div>
      <div class="jb-pill">
        <img src="icons_4x/icon_clock.png" alt="Time" />
        <span>02:28 AM</span>
      </div>
    </div>
  </header>
</body>
</html>
