name: Build Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CI: true

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: Juan-Buddy-${{ matrix.os }}
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify signing keystore
        run: keytool -list -keystore android/app/juanbuddy.keystore -storetype PKCS12 -storepass JBquack2026stable -alias juanbuddy > /dev/null && echo "keystore OK"

      - name: Prepare mobile web app
        run: node scripts/prep-mobile.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="${{ github.ref_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Juan-Buddy-android
          retention-days: 30
          path: android/app/build/outputs/apk/release/*.apk

  mobile-pwa:
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare mobile web app
        run: node scripts/prep-mobile.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Wait for artifact propagation
        run: sleep 25

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
