<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data: file:" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-badge">🐾</div>
        <div>
          <div class="brand-row">
            <h1 id="pet-name" title="Click to rename">Buddy</h1>
            <span id="status-pill" class="pill">Chilling</span>
          </div>
          <div class="brand-sub">
            <span class="lvl">LV <b id="level">1</b></span>
            <div class="xpbar"><div id="xp-fill" class="xpfill"></div></div>
            <span id="xp-text" class="muted">0 / 40 XP</span>
          </div>
        </div>
      </div>
      <div class="hud-pills">
        <div class="hud-pill coin-pill">
          <span class="hud-ico">🪙</span>
          <div class="hud-txt">
            <b id="coins">0</b>
            <span class="hud-sub"><span id="coin-rate">+0.0/s</span></span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="col-play">
      <div class="card playground">
        <div class="play-top">
          <div class="play-left">
            <span class="play-dot"></span>
            <span class="play-title">🏠 Juan Buddy Home</span>
            <span id="play-state" class="state-badge">IDLE</span>
          </div>
        </div>
        <div class="playground-wrap">
          <canvas id="dash-pet" width="240" height="240"></canvas>
          <div class="stage-hint">Tap pet to greet · Tap floor to walk</div>
        </div>
        <div class="care-grid">
          <div class="care">
            <div class="care-row"><span class="care-hunger">🍜 Hunger</span><span id="hunger-val" class="val">0%</span></div>
            <div class="bar"><div id="hunger-fill" class="fill hunger"></div></div>
          </div>
          <div class="care">
            <div class="care-row"><span class="care-happy">❤️ Happiness</span><span id="happy-val" class="val">0%</span></div>
            <div class="bar"><div id="happy-fill" class="fill happy"></div></div>
          </div>
          <div class="care">
            <div class="care-row"><span class="care-energy">⚡ Energy</span><span id="energy-val" class="val">0%</span></div>
            <div class="bar"><div id="energy-fill" class="fill energy"></div></div>
          </div>
        </div>
        <div class="play-actions">
          <button id="btn-play" class="btn btn-rose">🎾 Play (−8 ⚡)</button>
          <button id="btn-work" class="btn btn-amber">💼 Work: Off</button>
          <button id="btn-sleep" class="btn btn-indigo">😴 Rest / Wake</button>
          <button id="btn-cheer" class="btn btn-violet">✨ Cheer Me Up</button>
        </div>
      </div>
    </section>

    <aside class="col-panel">
      <nav class="tab-bar" id="tab-bar">
        <button data-tab="food" class="studio-tab on">🍜 Delicacies</button>
        <button data-tab="activities" class="studio-tab">🎯 Activities</button>
        <button data-tab="shop" class="studio-tab">🛠️ Shop</button>
        <button data-tab="pets" class="studio-tab">🐾 Pets</button>
      </nav>

      <main id="tab-panels">
        <div class="tab-panel panel-food">
          <section class="card">
            <h2>🍜 Delicacies <small class="muted">— feed your buddy world foods</small></h2>
            <div id="food-filters" class="filter-row"></div>
            <input id="food-search" class="search-box" type="text" placeholder="Search foods... (e.g. pad thai, samosa)" />
            <div id="food-grid" class="food-grid"></div>
          </section>
        </div>

        <div class="tab-panel hidden panel-activities">
          <section class="card">
            <h2>🎯 Activities <small class="muted">— earn extra coins &amp; XP</small></h2>
            <div id="activities" class="activity-list"></div>
          </section>
        </div>

        <div class="tab-panel hidden panel-shop">
          <section class="card">
            <h2>🛠️ Shop</h2>
            <div id="shop" class="shop-grid"></div>
          </section>
        </div>

        <div class="tab-panel hidden panel-pets">
          <section class="card">
            <h2>🐾 Choose Your Buddy</h2>
            <div id="buddy-grid" class="buddy-grid"></div>
          </section>
        </div>
      </main>
    </aside>
  </main>

  <footer>
    <label class="toggle">
      <input type="checkbox" id="open-login" />
      Open at login
    </label>
    <button id="btn-reset" class="link danger">Reset progress</button>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="../pet/sprites.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
